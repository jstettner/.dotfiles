onboarding = false

[ui]
mouse_capture = true

# pi-subagent children render as "↳ name" under their parent agent; their shared tab label is redundant.
[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", { token = "tab", rules = [{ equals = "subagents", hide = true }] }],
  # $doing is reported by ~/.pi/agent/extensions/herdr-activity.ts and disappears when idle.
  [{ token = "agent", rules = [{ starts_with = "↳", dim = true }] }, { token = "$doing", dim = true }],
]

[worktrees]
directory = "~/wt"

[keys]
goto = "prefix+alt+g"
focus_agent = "alt+1..9"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review agent replies"

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "herdr-arrange.open-tree"
description = "move pane to another tab or space"
